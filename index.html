<style>
  :root {

    --card-bg: #ffffff;
    --text: #2b2620;
    --text-muted: #7a7168;
    --accent: #b5813f;
    --accent-dark: #8a5f28;
    --border: #e6ded1;
    --check-bg: #f0e9dc;
    --done-bg: #eef6ee;
    --done-border: #a9d3a9;

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a17;
      --card-bg: #262320;
      --text: #ece6db;
      --text-muted: #a89e8e;
      --accent: #d6a35c;
      --accent-dark: #e8b876;
      --border: #3a352e;
      --check-bg: #322d26;
      --done-bg: #223326;
      --done-border: #3f6b45;
      --shadow: rgba(0, 0, 0, 0.35);
      --gold: #e0c04a;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    line-height: 1.5;
    padding: 24px 16px 80px;
  }

  .wrap { max-width: 760px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  h1 {
    font-size: clamp(24px, 5vw, 34px);
    margin: 0 0 6px;
    letter-spacing: 0.5px;
    color: var(--accent-dark);
  }
  .subtitle { color: var(--text-muted); font-size: 15px; font-style: italic; }

  .progress-bar-outer {
    max-width: 760px; margin: 20px auto 0; background: var(--check-bg);
    border-radius: 999px; height: 16px; overflow: hidden; border: 1px solid var(--border);
  }
  .progress-bar-inner {
    height: 100%; background: linear-gradient(90deg, var(--gold), var(--accent-dark));
    width: 0%; transition: width 0.4s ease;
  }
  .progress-label { text-align: center; font-size: 14px; color: var(--text-muted); margin-top: 8px; }

  .friends-box {
    max-width: 760px; margin: 22px auto 0; background: var(--card-bg);
    border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
  }
  .friends-title {
    font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px;
    text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 10px;
  }
  .friend-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .friend-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--check-bg); object-fit: cover; }
  .friend-info { flex: 1; min-width: 0; }
  .friend-name { font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 13px; margin-bottom: 3px; }
  .friend-bar-outer { height: 6px; border-radius: 999px; background: var(--check-bg); overflow: hidden; }
  .friend-bar-inner { height: 100%; background: var(--gold); }
  .friend-pct { font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; color: var(--text-muted); white-space: nowrap; }

  .section {
    margin-top: 36px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--card-bg); padding: 16px 16px 18px; box-shadow: 0 1px 4px var(--shadow);
    border-top: 4px solid var(--sec-color, var(--accent));
  }
  .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
  .section-badge {
    width: 38px; height: 38px; min-width: 38px; border-radius: 10px; display: flex;
    align-items: center; justify-content: center; font-size: 20px;
    background: color-mix(in srgb, var(--sec-color, var(--accent)) 18%, var(--check-bg));
    border: 1px solid color-mix(in srgb, var(--sec-color, var(--accent)) 45%, var(--border));
  }
  .section-titlewrap { flex: 1; min-width: 0; }
  .section-title { font-size: 18px; font-weight: bold; color: var(--sec-color, var(--accent-dark)); line-height: 1.2; }
  .section-count { font-size: 12.5px; color: var(--text-muted); font-family: -apple-system, Helvetica, Arial, sans-serif; margin-top: 2px; }
  .section-count.complete { color: var(--gold); font-weight: bold; }
  .section.complete { box-shadow: 0 0 0 2px var(--gold), 0 2px 10px var(--shadow); }
  .mini-bar-outer { height: 6px; border-radius: 999px; background: var(--check-bg); overflow: hidden; margin-top: 6px; }
  .mini-bar-inner { height: 100%; background: var(--sec-color, var(--accent)); width: 0%; transition: width 0.35s ease; }
  .section-desc { font-size: 13px; color: var(--text-muted); margin: 10px 0 12px; font-style: italic; }

  ul.wonder-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
  li.wonder-item { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; transition: background 0.2s ease, border-color 0.2s ease; }
  li.wonder-item.done {
    background: color-mix(in srgb, var(--sec-color, var(--accent)) 14%, var(--card-bg));
    border-color: var(--sec-color, var(--accent));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--sec-color, var(--accent)) 40%, transparent), 0 2px 8px color-mix(in srgb, var(--sec-color, var(--accent)) 25%, transparent);
  }
  .wonder-row { display: flex; align-items: flex-start; gap: 12px; padding: 11px 13px; }
  label.wonder-label { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; font-size: 15px; flex: 1; min-width: 0; }
  input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; width: 22px; height: 22px; min-width: 22px;
    border-radius: 6px; border: 2px solid var(--sec-color, var(--accent)); background: var(--check-bg);
    cursor: pointer; position: relative; flex-shrink: 0; margin-top: 1px;
  }
  input[type="checkbox"]:checked { background: var(--sec-color, var(--accent)); border-color: var(--sec-color, var(--accent-dark)); }
  input[type="checkbox"]:checked::after {
    content: "✓"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -58%);
    color: white; font-size: 15px; font-weight: bold; font-family: -apple-system, Helvetica, Arial, sans-serif;
  }
  .wonder-text { flex: 1; min-width: 0; }
  .wonder-name { display: block; }
  .wonder-note {
    display: block; font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px;
    color: var(--text-muted); margin-top: 3px; font-style: italic; line-height: 1.35;
  }
  .wonder-item.done .wonder-name { color: var(--sec-color, var(--accent-dark)); font-weight: bold; }
  .wonder-item.done .wonder-name::after { content: " ✓"; color: var(--sec-color, var(--accent-dark)); }

  footer { margin-top: 50px; text-align: center; font-size: 13px; color: var(--text-muted); }

  .achievement-toast {
    position: fixed; left: 50%; bottom: -120px; transform: translateX(-50%);
    background: linear-gradient(135deg, #2b2620, #40372a); color: #f6e6b8;
    border: 1px solid var(--gold); border-radius: 14px; padding: 14px 20px;
    display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    z-index: 1000; transition: bottom 0.5s cubic-bezier(.17,.89,.32,1.28); max-width: 90vw;
    font-family: -apple-system, Helvetica, Arial, sans-serif;
  }
  .achievement-toast.show { bottom: 24px; }
  .achievement-icon { font-size: 30px; }
  .achievement-text-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); margin-bottom: 2px; }
  .achievement-text-name { font-size: 15px; font-weight: bold; color: #fff; }

  .setup-warning {
    max-width: 760px; margin: 0 auto 20px; background: #4a1f1f; color: #ffd8d8;
    border: 1px solid #a33; border-radius: 10px; padding: 12px 16px; font-size: 13px;
    font-family: -apple-system, Helvetica, Arial, sans-serif; display: none;
  }
</style>
</head>

// ============================================================
// 1. НАСТРОЙКА FIREBASE — вставь сюда свой конфиг из консоли Firebase
//    (Project settings → General → Your apps → SDK setup and configuration)
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyBmUmgnyWK3JVCOpQZQc-e14_IUJw-QsPM",
  authDomain: "wonders-tracker-d5749.firebaseapp.com",
  projectId: "wonders-tracker-d5749",
  storageBucket: "wonders-tracker-d5749.firebasestorage.app",
  messagingSenderId: "189185203951",
  appId: "1:189185203951:web:8b6d73229eb8fb7543851a",
  measurementId: "G-TPBQFSBRKD"
};

let db = null;
let firebaseReady = false;
try {
  if (firebaseConfig.apiKey !== "ВСТАВЬ_СЮДА") {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebaseReady = true;
  } else {
    document.getElementById('setupWarning').style.display = 'block';
  }
} catch (e) {
  console.error('Firebase init failed', e);
  document.getElementById('setupWarning').style.display = 'block';
}

// ============================================================
// 2. TELEGRAM WEB APP — получаем данные о пользователе
// ============================================================
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
}
const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
const myId = tgUser ? String(tgUser.id) : 'local-guest';
const myName = tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') : 'Гость';
const myPhoto = tgUser && tgUser.photo_url ? tgUser.photo_url : '';

// ============================================================
// 3. Локальное состояние (fallback, если Firebase недоступен)
// ============================================================
const container = document.getElementById('sections');
const STATE_KEY = 'wonders-checklist-' + myId;

function loadLocal() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    return raw ? JSON.parse(raw) : { checked: {}, completed: {} };
  } catch (e) { return { checked: {}, completed: {} }; }
}
function saveLocal(state) {
  try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) {}
}

let localState = loadLocal();
let checkedState = localState.checked || {};
let completedSections = localState.completed || {};
const TOTAL_COUNTABLE = DATA.reduce((acc, s) => acc + s.items.filter(it => !it.excludeFromCount).length, 0);

function countDone(state) {
  let done = 0;
  DATA.forEach((section, si) => {
    section.items.forEach((item, ii) => {
      if (item.excludeFromCount) return;
      if (state[si + '_' + ii]) done++;
    });
  });
  return done;
}

let friends = {};

function renderFriends() {
  const box = document.getElementById('friendsBox');
  const entries = Object.entries(friends).filter(([id]) => id !== myId);
  if (entries.length === 0) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  box.innerHTML = '<div class="friends-title">Прогресс друзей</div>' + entries.map(([id, f]) => {
    const pct = TOTAL_COUNTABLE ? Math.round((f.done || 0) / TOTAL_COUNTABLE * 100) : 0;
    return '<div class="friend-row">' +
      '<img class="friend-avatar" src="' + (f.photo || '') + '" alt="">' +
      '<div class="friend-info"><div class="friend-name" data-name="' + id + '"></div>' +
      '<div class="friend-bar-outer"><div class="friend-bar-inner" style="width:' + pct + '%"></div></div></div>' +
      '<div class="friend-pct">' + (f.done || 0) + '/' + TOTAL_COUNTABLE + '</div>' +
    '</div>';
  }).join('');
  entries.forEach(([id, f]) => {
    const el = box.querySelector('[data-name="' + id + '"]');
    if (el) el.textContent = f.name || 'Без имени';
  });
}

// ============================================================
// 4. Синхронизация с Firestore
//    Структура: users/{id} = { checked, completed, name, photo, done, updatedAt }
//    Каждый пишет только свой документ; читают все документы коллекции users.
// ============================================================
async function persistState() {
  saveLocal({ checked: checkedState, completed: completedSections });
  if (!firebaseReady || !db) return;
  try {
    await db.collection('users').doc(myId).set({
      checked: checkedState,
      completed: completedSections,
      name: myName,
      photo: myPhoto,
      done: countDone(checkedState),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch (e) {
    console.error('Не удалось сохранить в Firestore', e);
  }
}

function initFirestoreSync() {
  if (!firebaseReady || !db) return;

  // Подписка на мой собственный документ (на случай синхронизации с другого устройства)
  db.collection('users').doc(myId).get().then(snap => {
    if (snap.exists) {
      const data = snap.data();
      checkedState = data.checked || {};
      completedSections = data.completed || {};
      saveLocal({ checked: checkedState, completed: completedSections });
      render();
    } else {
      persistState();
    }
  });

  // Подписка на всех участников — общий рейтинг прогресса
  db.collection('users').onSnapshot(qsnap => {
    qsnap.forEach(doc => {
      const data = doc.data();
      friends[doc.id] = { name: data.name || '', photo: data.photo || '', done: data.done || 0 };
    });
    renderFriends();
  }, err => console.error('roster listener error', err));
}

function keyFor(si, ii) { return si + '_' + ii; }
function isChecked(si, ii, item) {
  const k = keyFor(si, ii);
  if (Object.prototype.hasOwnProperty.call(checkedState, k)) return !!checkedState[k];
  return !!item.defaultDone;
}

function updateProgress() {
  let total = 0, done = 0;
  DATA.forEach((section, si) => {
    section.items.forEach((item, ii) => {
      if (item.excludeFromCount) return;
      total++;
      if (isChecked(si, ii, item)) done++;
    });
  });
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = done + ' из ' + total + ' отмечено (' + pct + '%)';
}

function showAchievement(section) {
  const toast = document.getElementById('achievementToast');
  document.getElementById('achievementIcon').textContent = section.icon || '🏆';
  document.getElementById('achievementName').textContent = section.title;
  toast.classList.add('show');
  clearTimeout(toast._hideTimer);
  toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 3800);
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}

function checkAchievement(si, section, countableItems, doneCount) {
  const k = 'sec_' + si;
  const isFull = countableItems.length > 0 && doneCount === countableItems.length;
  if (isFull && !completedSections[k]) {
    completedSections[k] = true;
    persistState();
    showAchievement(section);
  } else if (!isFull && completedSections[k]) {
    delete completedSections[k];
    persistState();
  }
}

function render() {
  container.innerHTML = '';

  DATA.forEach((section, si) => {
    const secDiv = document.createElement('div');
    secDiv.className = 'section';
    secDiv.style.setProperty('--sec-color', section.color || '#b5813f');

    const countableItems = section.items.filter(it => !it.excludeFromCount);
    const doneCount = section.items.reduce((acc, item, ii) => {
      if (item.excludeFromCount) return acc;
      return acc + (isChecked(si, ii, item) ? 1 : 0);
    }, 0);

    const isFull = countableItems.length > 0 && doneCount === countableItems.length;
    if (isFull) secDiv.classList.add('complete');

    const headerDiv = document.createElement('div');
    headerDiv.className = 'section-header';

    const badge = document.createElement('div');
    badge.className = 'section-badge';
    badge.textContent = section.icon || '🌍';
    headerDiv.appendChild(badge);

    const titleWrap = document.createElement('div');
    titleWrap.className = 'section-titlewrap';

    const titleEl = document.createElement('div');
    titleEl.className = 'section-title';
    titleEl.textContent = section.title + (isFull ? ' 🏆' : '');

    const countEl = document.createElement('div');
    countEl.className = 'section-count' + (isFull ? ' complete' : '');
    countEl.textContent = doneCount + ' / ' + countableItems.length + (isFull ? '  — пройдено!' : '');

    const miniBarOuter = document.createElement('div');
    miniBarOuter.className = 'mini-bar-outer';
    const miniBarInner = document.createElement('div');
    miniBarInner.className = 'mini-bar-inner';
    miniBarInner.style.width = (countableItems.length ? (doneCount / countableItems.length * 100) : 0) + '%';
    miniBarOuter.appendChild(miniBarInner);

    titleWrap.appendChild(titleEl);
    titleWrap.appendChild(countEl);
    titleWrap.appendChild(miniBarOuter);
    headerDiv.appendChild(titleWrap);
    secDiv.appendChild(headerDiv);

    if (section.desc) {
      const descDiv = document.createElement('div');
      descDiv.className = 'section-desc';
      descDiv.textContent = section.desc;
      secDiv.appendChild(descDiv);
    }

    const ul = document.createElement('ul');
    ul.className = 'wonder-list';

    section.items.forEach((item, ii) => {
      const k = keyFor(si, ii);
      const li = document.createElement('li');
      const checkedNow = isChecked(si, ii, item);
      li.className = 'wonder-item' + (checkedNow ? ' done' : '');

      const row = document.createElement('div');
      row.className = 'wonder-row';

      const label = document.createElement('label');
      label.className = 'wonder-label';

      let checkbox = null;
      if (!item.excludeFromCount) {
        checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = checkedNow;
        checkbox.addEventListener('change', () => {
          checkedState[k] = checkbox.checked;
          persistState();
          render();
          updateProgress();
          if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });
      }

      const textWrap = document.createElement('span');
      textWrap.className = 'wonder-text';

      const nameEl = document.createElement('span');
      nameEl.className = 'wonder-name';
      nameEl.textContent = item.name;
      textWrap.appendChild(nameEl);

      if (item.note) {
        const noteEl = document.createElement('span');
        noteEl.className = 'wonder-note';
        noteEl.textContent = item.note;
        textWrap.appendChild(noteEl);
      }

      if (checkbox) label.appendChild(checkbox);
      label.appendChild(textWrap);

      row.appendChild(label);
      li.appendChild(row);
      ul.appendChild(li);
    });

    secDiv.appendChild(ul);
    container.appendChild(secDiv);

    checkAchievement(si, section, countableItems, doneCount);
  });

  updateProgress();
}

render();
initFirestoreSync();
</script>
